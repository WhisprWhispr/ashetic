<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="antennaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>
    <radialGradient id="baseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#0072ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Glowing Base Platform / Cyber Ellipse -->
  <ellipse cx="250" cy="275" rx="200" ry="45" fill="url(#baseGlow)" />
  <ellipse cx="250" cy="275" rx="160" ry="32" fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="8 6" filter="url(#neon)" />
  <ellipse cx="250" cy="275" rx="110" ry="20" fill="none" stroke="#00d2ff" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Radiating Wifi Signal Waves From Antenna Center -->
  <path d="M 220 70 A 35 35 0 0 1 280 70" fill="none" stroke="#00f0ff" stroke-width="4.5" stroke-linecap="round" filter="url(#neon)" />
  <path d="M 200 50 A 60 60 0 0 1 300 50" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" opacity="0.85" filter="url(#neon)" />
  <path d="M 180 30 A 85 85 0 0 1 320 30" fill="none" stroke="#00d2ff" stroke-width="3.5" stroke-linecap="round" opacity="0.7" />
  <circle cx="250" cy="85" r="4" fill="#00f0ff" filter="url(#neon)"/>

  <!-- Left Antenna -->
  <rect x="135" y="60" width="16" height="150" rx="8" fill="url(#antennaGrad)" />
  <path d="M 135 70 L 151 70" stroke="#cbd5e1" stroke-width="2" />
  
  <!-- Right Antenna -->
  <rect x="349" y="60" width="16" height="150" rx="8" fill="url(#antennaGrad)" />
  <path d="M 349 70 L 365 70" stroke="#cbd5e1" stroke-width="2" />

  <!-- Shadow under router -->
  <ellipse cx="250" cy="258" rx="150" ry="22" fill="#030712" opacity="0.6" filter="blur(6px)" />

  <!-- Main Router Body (Modern Sleek Curved Box) -->
  <rect x="105" y="165" width="290" height="90" rx="28" fill="url(#bodyGrad)" stroke="#e2e8f0" stroke-width="2" />
  
  <!-- Top Highlight bevel -->
  <path d="M 130 167 L 370 167" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9" />

  <!-- Router Front Bevel Line -->
  <path d="M 115 220 Q 250 235 385 220" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.4" />

  <!-- Ashtatic Logo on Modem Body -->
  <g transform="translate(205, 185) scale(0.65)">
    <!-- Small A Icon -->
    <path d="M 16 35 L 26 12 C 26.5 11 28.5 11 29 12 L 39 35 C 39.5 36 38.5 37 37 37 L 33 37 L 27.5 24 L 22 37 L 18 37 C 16.5 37 15.5 36 16 35 Z" fill="#0072ff"/>
    <path d="M 30 14 A 5 5 0 0 1 35 19" fill="none" stroke="#0072ff" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 33 11 A 8 8 0 0 1 40 18" fill="none" stroke="#0072ff" stroke-width="1.8" stroke-linecap="round"/>
    <!-- Ashtatic Text -->
    <text x="45" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#0f172a">Ashtatic</text>
  </g>

  <!-- Glowing Cyan LED Indicators on Front -->
  <g transform="translate(180, 238)">
    <!-- Power LED -->
    <circle cx="20" cy="0" r="3.5" fill="#00f0ff" filter="url(#neon)"/>
    <!-- Internet LED -->
    <circle cx="55" cy="0" r="3.5" fill="#00f0ff" filter="url(#neon)"/>
    <!-- 2.4GHz Wifi LED -->
    <circle cx="90" cy="0" r="3.5" fill="#00f0ff" filter="url(#neon)"/>
    <!-- 5GHz Wifi LED -->
    <circle cx="125" cy="0" r="3.5" fill="#00f0ff" filter="url(#neon)"/>
  </g>
</svg>
