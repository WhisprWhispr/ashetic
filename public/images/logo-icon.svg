<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0072ff" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background subtle circle for contrast if needed -->
  <circle cx="50" cy="50" r="48" fill="#060c20" stroke="url(#cyanGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Ashtatic 'A' symbol -->
  <path d="M 22 75 L 47 22 C 48 19.5 52 19.5 53 22 L 78 75 C 79 77 77.5 79 75 79 L 64 79 C 62.5 79 61.2 78 60.5 76.5 L 50 53 L 39.5 76.5 C 38.8 78 37.5 79 36 79 L 25 79 C 22.5 79 21 77 22 75 Z" 
        fill="url(#cyanGrad)" filter="url(#glow)"/>
  
  <!-- Left accent bar overlay -->
  <path d="M 18 70 L 46 20 C 47.5 17 52.5 17 54 20 L 59 30 L 32 75 Z" 
        fill="#00f0ff" opacity="0.3"/>

  <!-- Dynamic Wifi Waves radiating from the top right -->
  <!-- Wave 1 (Small) -->
  <path d="M 58 26 A 10 10 0 0 1 68 36" fill="none" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Wave 2 (Medium) -->
  <path d="M 64 19 A 18 18 0 0 1 79 34" fill="none" stroke="#00f0ff" stroke-width="3.5" stroke-linecap="round" opacity="0.85"/>
  <!-- Wave 3 (Large) -->
  <path d="M 70 12 A 26 26 0 0 1 90 32" fill="none" stroke="#00d2ff" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Center Wifi dot -->
  <circle cx="54" cy="30" r="2.5" fill="#ffffff" />
</svg>
