<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0072ff" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="100" height="100" rx="24" fill="#040816"/>
  <rect width="98" height="98" x="1" y="1" rx="23" fill="none" stroke="url(#cyanGrad)" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Ashtatic 'A' symbol -->
  <path d="M 22 75 L 47 22 C 48 19.5 52 19.5 53 22 L 78 75 C 79 77 77.5 79 75 79 L 64 79 C 62.5 79 61.2 78 60.5 76.5 L 50 53 L 39.5 76.5 C 38.8 78 37.5 79 36 79 L 25 79 C 22.5 79 21 77 22 75 Z" 
        fill="url(#cyanGrad)" filter="url(#glow)"/>

  <!-- Dynamic Wifi Waves radiating from the top right -->
  <path d="M 58 26 A 10 10 0 0 1 68 36" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M 65 19 A 18 18 0 0 1 80 34" fill="none" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <path d="M 72 12 A 26 26 0 0 1 92 32" fill="none" stroke="#00d2ff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <circle cx="53" cy="30" r="3" fill="#ffffff" />
</svg>
